<!DOCTYPE html>
<!--
═══════════════════════════════════════════════════════════════
  HTML & CSS 4 · Практика вместе · ТЗ: сайт кофейни «Утро»

  Каркас уже готов: DOCTYPE, html, head, body.
  Не удаляйте его и не набирайте ! + Tab — шаблон уже есть,
  а комментарии с заданием сломаются.
  Код пишем ПОД комментарием каждого шага:
  шаги 1 и 3 — внутри head, шаг 2 — внутри body.

  Как проверять: сохранить файл (Ctrl+S) → обновить страницу
  в браузере (F5).

  В этой папке: index.html (этот файл), style.css, img/coffee.svg
═══════════════════════════════════════════════════════════════
-->
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!--
  ── ШАГ 1 · ЗАГОЛОВОК ВКЛАДКИ (повторяем урок 2) ─────────────────
  Что: тег title с текстом «Кофейня «Утро»».
  Зачем: это имя страницы — во вкладке браузера и в поиске Google.
  Проверка: на вкладке браузера — «Кофейня «Утро»».
  -->


  <!--
  ── ШАГ 3 · ПОДКЛЮЧИТЬ CSS (новое) ────────────────────────────────
  Что: здесь, под title, подключить файл style.css тегом link.
  Зачем: все стили сайта живут в одном файле — HTML не трогаем.
  Проверка: дальше работаем в style.css. Шаг 4 покажет,
            подключился ли файл.
  -->


</head>
<body>

  <!--
  ── ШАГ 2 · КОНТЕНТ (повторяем урок 3) ────────────────────────────
  Что: здесь, внутри body, по порядку:
    1) h1 — «Кофейня «Утро»»
    2) p — «Свежий кофе и выпечка каждый день с 8:00.»
    3) img — картинка img/coffee.svg, alt «Чашка кофе»
    4) h2 — «Меню»
    5) ul — три пункта li:
         Капучино — 180 сом / Латте — 200 сом / Круассан — 120 сом
    6) h2 — «Как заказать»
    7) ol — три пункта li:
         Выберите напиток / Скажите имя бариста / Заберите заказ
    8) p — «Мы в Instagram — пишите!», где слово Instagram —
         ссылка a на https://instagram.com
  Зачем: сначала содержимое, потом оформление. HTML — ЧТО на странице.
  Проверка: страница с текстом, картинкой и двумя списками.
            Пока белая и «скучная» — так и должно быть.
  -->


</body>
</html>
