<!DOCTYPE html>
<!--
═══════════════════════════════════════════════════════════════
  HTML & CSS 4 · Самостоятельно · ТЗ: страница любимого фильма

  Те же шаги, что в кофейне, — можно подглядывать в совместную
  практику. Фильм выбираете сами (или сериал, мультфильм, игру).

  Каркас уже готов: DOCTYPE, html, head, body.
  Не удаляйте его и не набирайте ! + Tab — шаблон уже есть,
  а комментарии с заданием сломаются.
  Код пишем ПОД комментарием каждого шага:
  шаги 1 и 3 — внутри head, шаг 2 — внутри body.

  Проверка: Ctrl+S → F5 в браузере.
  В папке: index.html, style.css, img/poster.svg
═══════════════════════════════════════════════════════════════
-->
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!--
  ── ШАГ 1 · ЗАГОЛОВОК ВКЛАДКИ ──────────────────────────────────────
  Что: title — название фильма.
  Проверка: на вкладке — название фильма.
  -->


  <!--
  ── ШАГ 3 · ПОДКЛЮЧИТЬ CSS ────────────────────────────────────────
  Что: здесь, под title, подключить style.css.
  Проверка: шаг 4 в style.css покрасит фон.
  -->


</head>
<body>

  <!--
  ── ШАГ 2 · КОНТЕНТ ──────────────────────────────────────────────
  Что: здесь, внутри body:
    1) h1 — название фильма
    2) p — 1–2 предложения: о чём фильм
    3) img — img/poster.svg (или свой постер в папке img), alt — «Постер»
    4) h2 — «Почему стоит посмотреть»
    5) ul — 3 причины
    6) h2 — «Мои любимые герои»
    7) ol — топ-3 героя
    8) p — «Трейлер на YouTube», где YouTube — ссылка на https://youtube.com
  Проверка: всё на странице, пока без оформления.
  -->


</body>
</html>
