<!--
── ШАГ 1 · КАРКАС (повторяем урок 2) ────────────────────────────
Что: каркас страницы — DOCTYPE, html, head, body.
     В head: <meta charset="UTF-8"> и title «Кофейня «Утро»».
     Быстро: в VS Code напишите ! и нажмите Tab.
Зачем: без каркаса браузер не знает, что где лежит.
       Без meta charset могут «сломаться» русские буквы.
Проверка: на вкладке браузера — «Кофейня «Утро»».
-->



<!--
── ШАГ 2 · КОНТЕНТ (повторяем урок 3) ────────────────────────────
Что: внутри body по порядку:
  1) h1 — «Кофейня «Утро»»
  2) p — «Свежий кофе и выпечка каждый день с 8:00.»
  3) img — картинка img/coffee.svg, alt «Чашка кофе»
  4) h2 — «Меню»
  5) ul — три пункта li:
       Капучино — 180 сом / Латте — 200 сом / Круассан — 120 сом
  6) h2 — «Как заказать»
  7) ol — три пункта li:
       Выберите напиток / Скажите имя бариста / Заберите заказ
  8) p — «Мы в Instagram — пишите!», где слово Instagram —
       ссылка a на https://instagram.com
Зачем: сначала содержимое, потом оформление. HTML — ЧТО на странице.
Проверка: страница с текстом, картинкой и двумя списками.
          Пока белая и «скучная» — так и должно быть.
-->
